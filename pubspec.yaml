name: hamo_tunnel_plus
description: OpenVPN & VPS Tunnel Client with .ovpn and Telegram Config Import
publish_to: 'none'
version: 2.7.4+49

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  openvpn_flutter: ^1.3.2
  file_picker: ^8.1.2
  receive_sharing_intent: ^1.8.1
  shared_preferences: ^2.3.2
  fl_chart: ^0.69.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/tunnel_hero_wings.jpg
    - assets/images/tunnel_emblem_badge.jpg
