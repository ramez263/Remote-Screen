name: Build Flutter APK & Web

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-and-web:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Android & Web platform files
        run: flutter create . --platforms=android,web --project-name golden_rewards

      - name: Install Flutter packages
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos

      - name: Build Release APK
        run: flutter build apk --release

      - name: Build Web Release
        run: flutter build web --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: golden-rewards-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: golden-rewards-web
          path: build/web/
